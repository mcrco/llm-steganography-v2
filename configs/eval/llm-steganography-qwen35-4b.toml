# Larger encode→decode eval on Qwen3.5-4B with TinyStories covers.
# Usage: uv run eval @ configs/eval/llm-steganography-qwen35-4b.toml
#
# Scale: 80 tasks (40 stories × both bits) × 4 rollouts = 320 episodes.
# Story rewrites need higher max_tokens than sentence buffers.

model = "Qwen/Qwen3.5-4B"
num_tasks = 80
num_rollouts = 4
push = true

[sampling]
max_tokens = 512

[env.taskset]
id = "mcrco/llm-steganography"
num_tasks = 80
split = "train"
seed = 0
min_words = 80
max_words = 180

[env.agent.harness]
id = "null"
