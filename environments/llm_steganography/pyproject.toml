[project]
name = "llm-steganography"
version = "0.1.0"
description = "Encode→decode linguistic steganography: hide a bit in a sentence rewrite, then recover it."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_steganography"]
